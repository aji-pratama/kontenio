services:
  db:
    image: postgres:15-alpine
    container_name: kontenio_db
    environment:
      - POSTGRES_DB=kontenio
      - POSTGRES_USER=kontenio
      - POSTGRES_PASSWORD=konteniosupersecret
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    container_name: kontenio_redis
    ports:
      - "6379:6379"

  web:
    build: .
    container_name: kontenio_web
    volumes:
      - .:/app
    ports:
      - "8001:8001"
    environment:
      - DJANGO_SETTINGS_MODULE=core.settings
      - DATABASE_URL=postgres://kontenio:konteniosupersecret@db:5432/kontenio
      - REDIS_URL=redis://redis:6379/0
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app/backend
    depends_on:
      - db
      - redis
    command: python3 backend/manage.py runserver 0.0.0.0:8001

  worker:
    build: .
    container_name: kontenio_worker
    volumes:
      - .:/app
    environment:
      - DJANGO_SETTINGS_MODULE=core.settings
      - DATABASE_URL=postgres://kontenio:konteniosupersecret@db:5432/kontenio
      - REDIS_URL=redis://redis:6379/0
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app/backend
    depends_on:
      - db
      - redis
    command: celery -A core worker -l info --concurrency=1

  beat:
    build: .
    container_name: kontenio_beat
    volumes:
      - .:/app
    environment:
      - DJANGO_SETTINGS_MODULE=core.settings
      - DATABASE_URL=postgres://kontenio:konteniosupersecret@db:5432/kontenio
      - REDIS_URL=redis://redis:6379/0
      - PYTHONPATH=/app/backend
    depends_on:
      - db
      - redis
    command: celery -A core beat -l info

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: kontenio_frontend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8001/api
    depends_on:
      - web

volumes:
  postgres_data:
